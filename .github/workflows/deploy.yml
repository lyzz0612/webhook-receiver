name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
      - uses: actions/checkout@v7
        if: env.HAS_CF_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.HAS_CF_TOKEN == 'true'
      # Uploads the Worker secrets that are set in GitHub; ones left unset keep their current value.
      - name: Prepare Worker secrets
        if: env.HAS_CF_TOKEN == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          node -e '
            const out = {};
            for (const k of ["ADMIN_PASSWORD", "SESSION_SECRET"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out));
          '
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json
