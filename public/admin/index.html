<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Webhook Receiver</title>
<style>
:root{
  --paper:#E6ECE8;--sheet:#FAFBF9;--ink:#16302A;--muted:#5C6E68;--line:#CBD6D0;
  --wire:#9DB3AA;--lamp:#22A06B;--danger:#B3372E;--focus:#2C7A5F;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{width:min(860px,100% - 32px);margin-inline:auto}
header{padding:28px 0 6px}
header .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:650;font-size:16px}
.brand svg{flex:none}
main{padding:14px 0 64px}
h2{font-size:17px;font-weight:650;margin:0}
h3{font-size:16px;font-weight:650;margin:0 0 18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
button{font:inherit;color:inherit;padding:6px 14px;border:1px solid var(--line);border-radius:7px;background:var(--sheet);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--wire);background:#fff}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button.primary:hover{background:#21443B;border-color:#21443B}
button.quiet{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
button.quiet:hover{color:var(--ink);background:var(--paper)}
button.danger{color:var(--danger)}
button.quiet.danger{color:var(--muted)}
button.quiet.danger:hover,button.quiet.danger:focus-visible{color:var(--danger);background:#F4E4E2}
button.link{border:none;background:none;color:var(--focus);padding:0;font-size:12px;text-decoration:underline}
button.done{border-color:var(--lamp);color:#17794F}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(44,122,95,.18)}
input[disabled]{background:var(--paper);color:var(--muted)}
input[type=checkbox]{width:auto;accent-color:var(--ink)}
textarea{min-height:84px;font-family:var(--mono);font-size:13px}
label{display:block;margin-bottom:12px}
label>span{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
label.inline{display:flex;gap:8px;align-items:center;margin:4px 0 0}
.help{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.toolbar{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.toolbar h2{flex:1}
.toolbar form{display:flex;gap:8px}
.toolbar input{width:230px}

/* A subscription panel has two zones: where messages arrive (top) and where they go (tinted band below). */
.sub{padding:0;overflow:hidden}
.sub-in{padding:18px 22px 20px}
.sub-out{background:#E3EBE6;border-top:1px solid #C3D0C9;padding:14px 22px 10px}
.sub-out .wires li::before,.sub-out .wires li::after{border-color:#8FA79D}
.zone-label{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.sub-out .zone-label{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sub-out .zone-label::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--wire);background:var(--sheet)}
.sub-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sub-name{font-size:17px;font-weight:650;letter-spacing:.01em}
.sub-token{color:var(--muted)}
.inlet{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.inlet select{width:auto;border:none;border-right:1px solid var(--line);border-radius:0;background:var(--paper);padding:8px 10px;font-size:13px}
.inlet select:focus{box-shadow:inset 0 0 0 2px var(--focus)}
.inlet .url{flex:1;min-width:0;align-self:center;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inlet button{border:none;border-left:1px solid var(--line);border-radius:0;padding:0 16px;background:#fff}
.inlet button:hover{background:var(--paper)}
.inlet button.done{color:#17794F;border-left-color:var(--line)}

.wires{list-style:none;margin:0;padding:0 0 0 3px}
.wires li{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding-left:22px}
.wires li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--wire)}
.wires li::after{content:"";position:absolute;left:0;top:50%;width:14px;border-top:1.5px solid var(--wire)}
.wires li:last-child::before{bottom:50%}
.wires li.add::before,.wires li.add::after{border-style:dashed}
.lamp{flex:none;width:9px;height:9px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px rgba(34,160,107,.16)}
.off .lamp{background:none;box-shadow:none;border:1.5px solid var(--wire)}
.t-type{font-weight:600;white-space:nowrap}
.t-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12em}
.t-sum{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-state{font-size:12px;color:var(--muted);white-space:nowrap}
.off .t-type,.off .t-name{color:var(--muted)}
.t-actions{display:flex;gap:2px;flex:none}
.wires li.add{color:var(--muted)}
.wires li.add button{color:var(--focus);padding-left:0}
.wires li.add button:hover{background:none;text-decoration:underline}

.empty{text-align:center;padding:44px 22px;color:var(--muted)}
.empty p{margin:0 0 4px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:24px}

.login{width:min(340px,100%);margin:12vh auto 0}
.login .brand{justify-content:center;margin-bottom:18px;font-size:17px}
.login button{width:100%;margin-top:4px}
.login .err{color:var(--danger);font-size:13px;min-height:1.6em;margin:2px 0 6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid2 .full{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;padding:24px;width:min(580px,calc(100vw - 24px));background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(22,48,42,.38)}
.field-row{display:flex;gap:8px}
.danger-zone{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}

@media (max-width:620px){
  header{padding-top:18px}
  .panel{padding:16px}
  .sub{padding:0}
  .sub-in{padding:16px}
  .sub-out{padding:12px 16px 8px}
  .toolbar form,.toolbar input{width:100%}
  .toolbar form{flex:1 1 100%}
  .inlet{flex-wrap:wrap}
  .inlet select{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--line)}
  .inlet .url{padding:10px 12px}
  .inlet button{padding:10px 16px}
  .wires{padding-left:8px}
  .wires li{gap:8px}
  /* One identifier per row on narrow screens: the name if there is one, else the summary (ntfy topic). */
  .has-name .t-sum{display:none}
  .t-name{flex:1;min-width:0;max-width:none}
  .t-state{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand"></div><nav id="nav" class="row"></nav></div></header>
<main><div class="wrap" id="app"></div></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
"use strict";
const $app = document.getElementById("app");
const $nav = document.getElementById("nav");
const $dlg = document.getElementById("dlg");
const state = { meta: null, subs: [], format: JSON.parse(localStorage.getItem("wr_format") || "{}") };

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== undefined && c !== null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch("/admin/api" + path, {
    method: opts.method || "GET",
    headers: opts.body !== undefined ? { "content-type": "application/json" } : {},
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/login") { renderLogin(); throw new Error("请先登录"); }
  if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
  return data;
}

async function run(fn) {
  try { return await fn(); } catch (e) { toast(e.message); }
}

/** Copies text; the button itself confirms ("已复制") for a moment. */
async function copy(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch { prompt("复制以下内容", text); return; }
  if (!button) return toast("已复制");
  button.textContent = "已复制";
  button.classList.add("done");
  clearTimeout(button.timer);
  button.timer = setTimeout(() => { button.textContent = "复制"; button.classList.remove("done"); }, 1400);
}

/** One inlet branching into three outlets: the relay this tool is. */
function logo(size = 22) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = '<g fill="none" stroke="#16302A" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h6M9 12c3 0 3-7 7-7M9 12h7M9 12c3 0 3 7 7 7"/></g>'
    + '<g fill="#22A06B"><circle cx="18.5" cy="5" r="2.2"/><circle cx="18.5" cy="12" r="2.2"/><circle cx="18.5" cy="19" r="2.2"/></g>';
  return svg;
}
document.getElementById("brand").append(logo(), "Webhook Receiver");

const mask = (t) => (t ? t.slice(0, 3) + "•••••" : "");
const outMeta = (type) => state.meta.outbound.find((o) => o.type === type);
const typeLabel = (t) => outMeta(t.type)?.label ?? t.type;
/** How a target is referred to in prompts: its name, else type + summary. */
const targetTitle = (t) => t.name || [typeLabel(t), t.summary].filter(Boolean).join(" ");

function subUrl(type, sub) {
  const tpl = state.meta.inbound.find((x) => x.type === type).urlTemplate;
  const base = location.origin + "/" + type + "/" + encodeURIComponent(sub.name);
  return tpl.replace("{base}", base).replace("{token}", encodeURIComponent(sub.token));
}

function openDialog(...children) {
  $dlg.replaceChildren(...children);
  if (!$dlg.open) $dlg.showModal();
}
const closeDialog = () => $dlg.close();

/** Replaces one subscription in local state (by old name, so renames work) and re-renders. */
function updateSub(oldName, sub) {
  const i = state.subs.findIndex((s) => s.name === oldName);
  if (sub && i >= 0) state.subs[i] = sub;
  else if (sub) state.subs.push(sub);
  else if (i >= 0) state.subs.splice(i, 1);
  if (sub && oldName !== sub.name && state.format[oldName]) {
    state.format[sub.name] = state.format[oldName];
    delete state.format[oldName];
    localStorage.setItem("wr_format", JSON.stringify(state.format));
  }
  state.subs.sort((a, b) => a.name.localeCompare(b.name));
  renderSubs();
}

function renderLogin() {
  $nav.replaceChildren();
  const pwd = h("input", { type: "password", placeholder: "管理密码", autocomplete: "current-password", "aria-label": "管理密码" });
  const err = h("p", { class: "err", role: "alert" });
  const submit = (e) => {
    e.preventDefault();
    api("/login", { method: "POST", body: { password: pwd.value } })
      .then(boot)
      .catch((x) => { err.textContent = x.message; pwd.select(); });
  };
  document.getElementById("brand").style.visibility = "hidden";
  $app.replaceChildren(
    h("form", { class: "login panel", onsubmit: submit },
      h("div", { class: "brand" }, logo(26), "Webhook Receiver"),
      h("label", {}, pwd),
      err,
      h("button", { class: "primary", type: "submit" }, "登录")),
  );
  pwd.focus();
}

async function boot() {
  state.meta = await api("/meta");
  state.subs = await api("/subscriptions");
  document.getElementById("brand").style.visibility = "";
  $nav.replaceChildren(h("button", { class: "quiet", onclick: () => run(async () => { await api("/logout", { method: "POST" }); renderLogin(); }) }, "退出登录"));
  renderSubs();
}

function renderSubs() {
  const name = h("input", { placeholder: "新订阅名，如 nas", "aria-label": "新订阅名", pattern: "[a-z0-9_\\-]{1,64}", title: "1–64 位小写字母、数字、_ 或 -" });
  const create = (e) => {
    e.preventDefault();
    run(async () => {
      const sub = await api("/subscriptions", { method: "POST", body: { name: name.value.trim() } });
      updateSub(sub.name, sub);
      toast("已新建订阅 " + sub.name);
    });
  };
  const list = state.subs.length
    ? state.subs.map(renderSubPanel)
    : [h("div", { class: "panel empty" },
        h("p", {}, "还没有订阅。"),
        h("p", {}, "在右上角输入一个名字新建，然后把生成的地址填到要推送通知的应用里。"))];
  $app.replaceChildren(
    h("div", { class: "toolbar" },
      h("h2", {}, "订阅"),
      h("form", { onsubmit: create }, name, h("button", { class: "primary", type: "submit" }, "新建"))),
    ...list,
    state.subs.length ? h("p", { class: "foot" }, "其他设备上的改动可能稍后才显示。") : null,
  );
}

function renderSubPanel(sub) {
  const formats = state.meta.inbound;
  const chosen = formats.some((f) => f.type === state.format[sub.name]) ? state.format[sub.name] : "all";
  const url = h("span", { class: "url mono", title: "" });
  const setUrl = (type) => { url.textContent = subUrl(type, sub); url.title = url.textContent; };
  setUrl(chosen);
  const select = h("select", { "aria-label": "推送格式", onchange: (e) => {
    state.format[sub.name] = e.target.value;
    localStorage.setItem("wr_format", JSON.stringify(state.format));
    setUrl(e.target.value);
  } }, formats.map((f) => h("option", { value: f.type, selected: f.type === chosen }, f.label)));
  const copyBtn = h("button", { onclick: () => copy(url.textContent, copyBtn) }, "复制");

  const branches = sub.targets.map((t) => h("li", { class: [t.enabled ? "" : "off", t.name ? "has-name" : ""].join(" ").trim() || undefined },
    h("span", { class: "lamp", title: t.enabled ? "已启用" : "已停用" }),
    h("span", { class: "t-type" }, typeLabel(t)),
    t.name ? h("span", { class: "t-name" }, t.name) : null,
    h("span", { class: "t-sum mono", title: t.summary || "" }, t.summary || ""),
    t.enabled ? null : h("span", { class: "t-state" }, "已停用"),
    h("span", { class: "t-actions" },
      h("button", { class: "quiet", onclick: () => editTarget(sub, t) }, "编辑"),
      h("button", { class: "quiet danger", onclick: () => deleteTarget(sub, t) }, "删除"))));
  branches.push(h("li", { class: "add" },
    h("button", { class: "quiet", onclick: () => editTarget(sub, null) },
      sub.targets.length ? "添加转发目标" : "添加转发目标，收到的通知会发到这里")));

  const active = sub.targets.filter((t) => t.enabled).length;
  return h("section", { class: "panel sub", "aria-label": "订阅 " + sub.name },
    h("div", { class: "sub-in" },
      h("div", { class: "sub-head" },
        h("span", { class: "sub-name" }, sub.name),
        h("span", { class: "sub-token mono grow" }, "token " + mask(sub.token)),
        h("button", { class: "quiet", onclick: () => editSub(sub) }, "设置")),
      h("p", { class: "zone-label" }, "接收地址，选择推送格式后复制给发送方"),
      h("div", { class: "inlet" }, select, url, copyBtn)),
    h("div", { class: "sub-out" },
      h("p", { class: "zone-label" }, sub.targets.length ? `转发到 ${active} 个目标` + (active < sub.targets.length ? `，${sub.targets.length - active} 个已停用` : "") : "转发到"),
      h("ul", { class: "wires" }, branches)));
}

function editSub(sub) {
  const name = h("input", { value: sub.name });
  const token = h("input", { value: sub.token, autocomplete: "off" });
  const rename = () => run(async () => {
    const n = name.value.trim();
    if (n === sub.name) return;
    if (!confirm("改名后所有客户端的 URL 都会变，需要逐个更新。确定改名为「" + n + "」？")) return;
    const updated = await api("/subscriptions/" + sub.name, { method: "PUT", body: { name: n } });
    updateSub(sub.name, updated);
    toast("已改名");
    editSub(updated);
  });
  const setToken = (body, msg) => run(async () => {
    if (!confirm(msg)) return;
    const updated = await api("/subscriptions/" + sub.name + "/token", { method: "POST", body });
    updateSub(sub.name, updated);
    toast("token 已更新");
    editSub(updated);
  });
  const remove = () => {
    if (!confirm("删除订阅「" + sub.name + "」及其全部转发目标？此操作不可恢复。")) return;
    run(async () => {
      await api("/subscriptions/" + sub.name, { method: "DELETE" });
      closeDialog();
      updateSub(sub.name, null);
      toast("已删除");
    });
  };
  token.classList.add("mono");
  openDialog(
    h("h3", {}, "订阅设置"),
    h("label", {}, h("span", {}, "订阅名"),
      h("div", { class: "field-row" }, h("div", { class: "grow" }, name), h("button", { onclick: rename }, "改名"))),
    h("p", { class: "help", style: "margin:-6px 0 14px" }, "改名后，所有应用里填的地址都要换成新的。"),
    h("label", {}, h("span", {}, "Token"),
      h("div", { class: "field-row" }, h("div", { class: "grow" }, token),
        h("button", { onclick: () => setToken({ token: token.value.trim() }, "把 token 改成输入框里的值？所有应用里的地址都要更新。") }, "保存"),
        h("button", { onclick: () => setToken({}, "随机生成新 token？所有应用里的地址都要更新。") }, "随机生成"))),
    h("p", { class: "help", style: "margin-top:-6px" }, "8–128 位，可用字母、数字和 . _ ~ : -"),
    h("div", { class: "danger-zone" },
      h("span", { class: "grow help", style: "margin:0" }, "删除订阅会同时删除它的全部转发目标。"),
      h("button", { class: "danger", onclick: remove }, "删除订阅")),
    h("div", { class: "actions" }, h("button", { onclick: closeDialog }, "完成")));
}

function emptyConfig(type) {
  const config = {};
  for (const f of outMeta(type).fields) config[f.key] = f.kind === "select" ? f.options[0] : "";
  return config;
}

/** Add (t = null) or edit one target in a dialog. Secret fields start blank and mean "keep the stored value". */
function editTarget(sub, t) {
  const d = t
    ? { name: t.name, type: t.type, enabled: t.enabled, config: { ...t.config }, secrets_set: t.secrets_set || [], clear: [] }
    : { name: "", type: state.meta.outbound[0].type, enabled: true, config: emptyConfig(state.meta.outbound[0].type), secrets_set: [], clear: [] };
  const payload = () => ({ name: d.name, type: d.type, enabled: d.enabled, config: d.config, clear: d.clear });

  function draw() {
    const m = outMeta(d.type);
    const fields = m.fields.filter((f) => !f.showIf || f.showIf.values.includes(String(d.config[f.showIf.key])));
    const inputs = fields.map((f) => {
      const isSecret = m.secretFields.includes(f.key);
      const set = isSecret && d.secrets_set.includes(f.key) && !d.clear.includes(f.key);
      const placeholder = set ? "已设置，留空表示不修改" : f.placeholder || "";
      const onchange = (e) => { d.config[f.key] = e.target.value; if (f.kind === "select") draw(); };
      let input;
      if (f.kind === "select") input = h("select", { onchange }, f.options.map((o) => h("option", { value: o, selected: d.config[f.key] === o }, o)));
      else if (f.kind === "textarea") input = h("textarea", { placeholder, oninput: onchange, value: d.config[f.key] ?? "" });
      else input = h("input", { type: f.kind === "password" ? "password" : "text", placeholder, oninput: onchange, value: d.config[f.key] ?? "", autocomplete: "off" });
      const clearBtn = set ? h("button", { class: "link", type: "button", onclick: () => { d.clear.push(f.key); d.config[f.key] = ""; draw(); } }, "清空已保存的值") : null;
      return h("label", { class: f.kind === "textarea" ? "full" : "" }, h("span", {}, f.label, " ", clearBtn), input, f.help ? h("div", { class: "help" }, f.help) : null);
    });
    // The type can only be chosen when adding; an existing target keeps its type.
    const typeSelect = t
      ? h("input", { value: m.label, disabled: true })
      : h("select", { onchange: (e) => { d.type = e.target.value; d.config = emptyConfig(d.type); draw(); } },
          state.meta.outbound.map((o) => h("option", { value: o.type, selected: o.type === d.type }, o.label)));
    openDialog(
      h("h3", {}, t ? "编辑转发目标" : "添加转发目标"),
      h("div", { class: "grid2" },
        h("label", {}, h("span", {}, "类型"), typeSelect),
        // ntfy is identified by its topic, so it has no name field.
        m.named ? h("label", {}, h("span", {}, "名称"), h("input", { value: d.name, placeholder: "例如：家庭群", oninput: (e) => (d.name = e.target.value) })) : null,
        ...inputs),
      h("label", { class: "inline" }, h("input", { type: "checkbox", checked: d.enabled, onchange: (e) => (d.enabled = e.target.checked) }), "启用，收到通知时转发到这里"),
      h("div", { class: "actions" },
        h("button", { onclick: closeDialog }, "取消"),
        h("button", { class: "primary", onclick: save }, "保存")));
  }

  const save = () => run(async () => {
    const updated = t
      ? await api("/subscriptions/" + sub.name + "/targets/" + t.id, { method: "PUT", body: payload() })
      : await api("/subscriptions/" + sub.name + "/targets", { method: "POST", body: payload() });
    closeDialog();
    updateSub(sub.name, updated);
    toast("已保存");
  });

  draw();
}

function deleteTarget(sub, t) {
  if (!confirm("删除目标「" + targetTitle(t) + "」？")) return;
  run(async () => {
    updateSub(sub.name, await api("/subscriptions/" + sub.name + "/targets/" + t.id, { method: "DELETE" }));
    toast("已删除");
  });
}

api("/meta").then(boot, () => {});
</script>
</body>
</html>
